# Explicit theme, matching webapp/theme.py's light "bento card" palette.
#
# Without this file, or with a stale/mismatched one, Streamlit still applies
# its own theme colors to natively-rendered components (the dataframe grid -
# a canvas, not real DOM text, so no CSS override in theme.py can reach it -
# plus the selectbox, radio/segmented control internals, sliders, tooltips).
# Those need to agree with the CSS theme or native components render with the
# wrong-context colors: this file previously left over `base = "dark"` /
# `textColor = "#f3f2fa"` from an earlier dark iteration of this dashboard,
# which meant every native component still rendered pale, light-on-dark text
# - on this theme's white/light backgrounds that text was nearly invisible
# (confirmed on the day/window toggle: computed color #f3f2fa on a white pill).
# Keep this in sync whenever webapp/theme.py's palette changes.
[theme]
base = "light"
primaryColor = "#0284c7"
backgroundColor = "#edeceb"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"
